<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 主题库</title>
<style>
:root{
  --accent:#005fb8; --accent-light:#0078d4; --accent-press:#00539c;
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;
  --radius:8px; --radius-sm:4px;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg1:#f8fafd; --bg2:#eef2f8; --bg3:#fdfeff;
  --text:#1a1f2b; --text-2:#5b6473; --text-3:#8b93a3;
  --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.88);
  --surface-solid:#ffffff;
  --card:rgba(255,255,255,.78); --card-hover:rgba(255,255,255,.96);
  --border:rgba(0,0,0,.078); --border-strong:rgba(0,0,0,.14);
  --stroke-input:rgba(0,0,0,.12);
  --shadow-2:0 2px 6px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --shadow-3:0 4px 12px rgba(0,0,0,.1),0 16px 48px rgba(0,0,0,.16);
  --scrim:rgba(230,235,244,.6);
  --pill-hover:rgba(0,0,0,.045); --pill-active:rgba(0,95,184,.09);
  --img-bg:#dde3ec;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#141a28; --bg2:#101522; --bg3:#1a2135;
  --text:#e9eef7; --text-2:#a7b0c0; --text-3:#6f7a8f;
  --surface:rgba(30,36,52,.66); --surface-2:rgba(26,32,47,.9);
  --surface-solid:#1f2637;
  --card:rgba(35,42,60,.72); --card-hover:rgba(44,52,73,.94);
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --stroke-input:rgba(255,255,255,.16);
  --shadow-2:0 2px 6px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --shadow-3:0 4px 12px rgba(0,0,0,.4),0 16px 56px rgba(0,0,0,.55);
  --scrim:rgba(8,11,18,.66);
  --pill-hover:rgba(255,255,255,.055); --pill-active:rgba(76,194,255,.12);
  --img-bg:#232a3d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  font-family:var(--font); color:var(--text); min-height:100vh;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(0,120,212,.14), transparent 60%),
    radial-gradient(900px 520px at -10% 105%, rgba(136,92,232,.12), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  font-size:14px; overflow:hidden;
}
#bgOrbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgOrbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.14}
#bgOrbs span:nth-child(1){width:520px;height:520px;left:62%;top:-14%;background:#0078d4;animation:drift 26s ease-in-out infinite alternate}
#bgOrbs span:nth-child(2){width:440px;height:440px;left:-8%;top:58%;background:#8b5cf6;animation:drift 32s ease-in-out infinite alternate-reverse}
#bgOrbs span:nth-child(3){width:360px;height:360px;left:38%;top:76%;background:#06b6d4;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,-50px) scale(1.15)}}

/* ---------- App shell ---------- */
.app{
  position:relative;z-index:1;display:flex;height:100vh;padding:12px;gap:12px;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:264px;flex:0 0 264px;display:flex;flex-direction:column;
  background:var(--surface);backdrop-filter:blur(48px) saturate(1.6);-webkit-backdrop-filter:blur(48px) saturate(1.6);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-2);
  overflow:hidden;
}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.brand .logo{
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,#0078d4,#4cc2ff 55%,#8b5cf6);
  box-shadow:0 4px 14px rgba(0,120,212,.45);
}
.brand h1{font-family:var(--font-display);font-size:16px;font-weight:650;letter-spacing:.2px}
.brand p{font-size:11.5px;color:var(--text-3);margin-top:2px}

.search-wrap{padding:4px 14px 12px}
.search{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;
  background:var(--surface-solid);border:1px solid var(--stroke-input);border-bottom:2px solid var(--stroke-input);
  border-radius:var(--radius);transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-bottom-color:var(--accent);box-shadow:0 0 0 1px rgba(0,95,184,.14)}
.search svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--text-2)}
.search input{flex:1;border:none;outline:none;background:none;color:var(--text);font-size:13px;font-family:var(--font)}
.search input::placeholder{color:var(--text-3)}
.search .clear{display:none;cursor:pointer;color:var(--text-3);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px}
.search .clear:hover{background:var(--pill-hover)}
.search.has-text .clear{display:block}

.nav-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:1px;padding:6px 22px 6px}
.nav{flex:1;overflow-y:auto;padding:0 8px 12px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:8px 12px;margin:1px 0;border:none;border-radius:var(--radius);
  background:none;color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer;
  position:relative;text-align:left;transition:background .12s;
}
.nav-item:hover{background:var(--pill-hover)}
.nav-item.active{background:var(--pill-active);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--accent);
}
html[data-theme="dark"] .nav-item.active::before{background:#4cc2ff}
.nav-item .ico{width:22px;height:22px;display:grid;place-items:center;font-size:14px;flex:0 0 22px;
  background:var(--surface-solid);border:1px solid var(--border);border-radius:6px}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11px;color:var(--text-3);background:var(--surface-solid);
  border:1px solid var(--border);border-radius:9px;padding:1px 7px}
.sidebar-foot{padding:10px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;
  background:var(--surface);backdrop-filter:blur(48px) saturate(1.6);-webkit-backdrop-filter:blur(48px) saturate(1.6);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-2);overflow:hidden;
}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar .title h2{font-family:var(--font-display);font-size:19px;font-weight:650;display:flex;align-items:center;gap:10px}
.topbar .title p{font-size:12px;color:var(--text-2);margin-top:3px}
.topbar .spacer{flex:1}
.toolbar{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--surface-solid);color:var(--text);font-family:var(--font);font-size:12.5px;cursor:pointer;
  transition:background .12s,transform .1s;
}
.btn:hover{background:var(--pill-hover)}
.btn:active{transform:scale(.98)}
select.btn{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.lang-wrap{position:relative}
.lang-menu{
  position:absolute;right:0;top:calc(100% + 6px);min-width:158px;z-index:60;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius);
  box-shadow:var(--shadow-3);padding:4px;backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top right;
  transition:opacity .15s,transform .18s cubic-bezier(.2,.9,.3,1),visibility .15s;
}
.lang-menu.open{opacity:1;visibility:visible;transform:none}
.lang-menu button{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:none;border-radius:6px;
  background:none;color:var(--text);font-family:var(--font);font-size:12.5px;cursor:pointer;text-align:left;
  transition:background .1s;
}
.lang-menu button:hover{background:var(--pill-hover)}
.lang-menu button .ck{width:14px;flex:0 0 14px;color:var(--accent);font-weight:700;visibility:hidden}
.lang-menu button.active .ck{visibility:visible}
html[data-theme="dark"] .lang-menu button .ck{color:#4cc2ff}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-press)}
html[data-theme="dark"] .btn.primary{background:#4cc2ff;color:#0b1220}
html[data-theme="dark"] .btn.primary:hover{background:#35b2f0}
.icon-btn{width:34px;padding:0;justify-content:center;font-size:15px}

/* ---------- Grid ---------- */
.content{flex:1;overflow-y:auto;padding:18px 22px 26px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  transition:transform .18s cubic-bezier(.2,.9,.3,1),box-shadow .18s,background .18s,border-color .18s;
  backdrop-filter:blur(20px);
}
.card:hover{transform:translateY(-3px);background:var(--card-hover);box-shadow:var(--shadow-2);border-color:var(--border-strong)}
.card:active{transform:translateY(-1px) scale(.995)}
.card .thumb{position:relative;aspect-ratio:16/9;background:var(--img-bg);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.card:hover .thumb img{transform:scale(1.06)}
.card .badge{
  position:absolute;top:9px;right:9px;font-size:11px;font-weight:600;
  background:rgba(0,0,0,.58);color:#fff;padding:3px 9px;border-radius:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);
}
.card .cat-chip{
  position:absolute;top:9px;left:9px;font-size:11px;font-weight:500;
  background:rgba(0,0,0,.5);color:#fff;padding:3px 9px;border-radius:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);
}
.card .body{padding:12px 14px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .name{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .pub{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.stars{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2)}
.stars .s{color:#e8a508;letter-spacing:1px;font-size:12px}
.price{font-size:11px;font-weight:600;color:#0f7b45;background:rgba(21,153,77,.13);
  border:1px solid rgba(21,153,77,.25);padding:2px 8px;border-radius:10px}
.price.paid{color:#a4432b;background:rgba(200,77,43,.12);border-color:rgba(200,77,43,.25)}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 20px;color:var(--text-3)}
.empty .e-ico{font-size:44px}
.empty p{font-size:13.5px}
.empty .ms-badge{display:inline-flex;align-items:center;padding:8px 14px;margin-top:2px;
  background:#0b1220;border:1px solid #2a3242;border-radius:8px;line-height:0;
  transition:transform .15s,box-shadow .15s}
.empty .ms-badge:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.empty .ms-badge img{height:38px;display:block}

/* ---------- Modal ---------- */
.scrim{
  position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;padding:26px;z-index:100;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;
}
.scrim.open{opacity:1;visibility:visible}
.dialog{
  width:min(920px,100%);max-height:calc(100vh - 52px);display:flex;flex-direction:column;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow-3);transform:scale(.96) translateY(12px);transition:transform .24s cubic-bezier(.2,.9,.3,1);
}
.scrim.open .dialog{transform:none}
.dialog .d-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.d-head .d-icon{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--img-bg);flex:0 0 52px;border:1px solid var(--border)}
.d-head .d-icon img{width:100%;height:100%;object-fit:cover}
.d-head .d-t{flex:1;min-width:0}
.d-head .d-t h3{font-family:var(--font-display);font-size:18px;font-weight:650}
.d-head .d-t .d-pub{font-size:12.5px;color:var(--text-2);margin-top:4px}
.d-head .d-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.d-head .d-tags span{font-size:11px;padding:2.5px 10px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-solid);color:var(--text-2)}
.d-close{width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-solid);
  color:var(--text);font-size:16px;cursor:pointer;display:grid;place-items:center;flex:0 0 34px}
.d-close:hover{background:rgba(192,32,32,.1);color:#c42b1c}
.d-body{overflow-y:auto;padding:18px 22px}
.d-body::-webkit-scrollbar{width:8px}
.d-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;border:2px solid transparent;background-clip:content-box}
.d-hero{width:100%;border-radius:var(--radius);display:block;background:var(--img-bg);border:1px solid var(--border);cursor:zoom-in}
.d-sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.d-sub img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;
  background:var(--img-bg);transition:transform .15s,box-shadow .15s}
.d-sub img:hover{transform:scale(1.03);box-shadow:var(--shadow-2)}
.d-desc{margin-top:16px;font-size:13px;line-height:1.8;color:var(--text-2)}
.d-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.d-info .cell{background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.d-info .cell b{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:4px}
.d-info .cell span{font-size:13px;font-weight:600}
.d-foot{display:flex;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--border)}
.d-foot .btn{height:38px;padding:0 20px;font-size:13px}

.viewer{position:fixed;inset:0;background:rgba(5,8,14,.9);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.viewer.open{display:flex}
.viewer img{max-width:94vw;max-height:92vh;border-radius:var(--radius);box-shadow:0 24px 80px rgba(0,0,0,.6)}

/* ---------- Carousel ---------- */
.carousel{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--img-bg)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;scroll-snap-align:center}
.car-slide img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:zoom-in}
.car-btn{
  position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .12s;
}
.car-btn:hover{background:rgba(0,0,0,.68)}
.car-btn.l{left:10px}.car-btn.r{right:10px}
.car-ind{
  position:absolute;right:12px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;
  padding:2px 10px;border-radius:10px;font-size:11.5px;pointer-events:none;
}
.d-sub img.active{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Bing view ---------- */
.grid>*:is(.bing-hero,.bing-sec-label,.bing-strip,.bing-bar){grid-column:1/-1}
.bing-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(20px)}
.bing-hero>img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--img-bg);cursor:zoom-in}
.bing-meta{padding:14px 18px 4px}
.bing-meta h3{font-family:var(--font-display);font-size:16px;font-weight:650}
.bing-meta p{font-size:12.5px;color:var(--text-2);margin-top:4px}
.bing-actions{display:flex;gap:10px;padding:10px 18px 16px}
.bing-sec-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:1px;margin-top:16px}
.bing-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.bing-strip img{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--border);
  cursor:pointer;background:var(--img-bg);transition:transform .15s,box-shadow .15s;
}
.bing-strip img:hover{transform:scale(1.04);box-shadow:var(--shadow-2)}
.bing-strip img.active{outline:2px solid var(--accent);outline-offset:1px}
.bing-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bing-bar .nav-arrow{width:34px;padding:0;justify-content:center;font-size:13px}
.bing-bar .cur{font-size:13px;font-weight:600;min-width:118px;text-align:center}
input.month{
  height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--surface-solid);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none;
}
input.month:focus{border-color:var(--accent)}
input.month::-webkit-calendar-picker-indicator{filter:invert(.4);cursor:pointer}
html[data-theme="dark"] input.month::-webkit-calendar-picker-indicator{filter:invert(.85)}
.bing-note{font-size:12px;color:var(--text-3);margin-top:2px}
.bing-date{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---------- Anim ---------- */
.card{animation:rise .4s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:11px 20px;font-size:13px;box-shadow:var(--shadow-3);
  z-index:300;transition:transform .3s cubic-bezier(.2,.9,.3,1);backdrop-filter:blur(30px);
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;padding:8px}
  .sidebar{width:100%;flex:none}
  .nav{max-height:190px}
  .content{overflow:visible}
}
</style>
</head>
<body>
<div id="bgOrbs"><span></span><span></span><span></span></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🖼️</div>
      <div>
        <h1 id="brandTitle">Windows 主题库</h1>
        <p id="brandSub">精选桌面主题</p>
      </div>
    </div>
    <div class="search-wrap">
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索主题名称、发布商…" autocomplete="off">
        <span class="clear" id="searchClear">✕</span>

const $ = id=>document.getElementById(id);
const state = {cat:null, q:'', sort:'rating', lang:'en'};
const descOf = t=>state.lang==='en' ? (EN_DESC[t['序号']]||t['描述']||'') : (t['描述']||'');
function L(k,...a){const v=I18N[state.lang][k];return typeof v==='function'?v(...a):v;}
const catName = c=>state.lang==='zh' ? c.name : (CAT_NAMES_EN[c.name]||c.name);
const priceText = t=>isPaid(t) ? t['价格'] : L('free');
let curDetailId = null;

/* ---------- helpers ---------- */
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const previews = t=>(t['预览图']||'').split('|').filter(Boolean);
const isPaid = t=>t['价格'] && t['价格']!=='免费下载';
function starStr(r){const f=Math.round(Number(r)||0);return '★'.repeat(Math.min(5,f))+'☆'.repeat(5-Math.min(5,f));}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}

/* ---------- sidebar ---------- */
function renderNav(){
  const nav = $('nav');
  const total = THEMES.length;
  let html = `<button class="nav-item${state.cat==='__bing__'?' active':''}" data-cat="__bing__">
      <span class="ico">📅</span><span class="nm">${L('bingCat')}</span></button>`;
  html += `<button class="nav-item${state.cat===null?' active':''}" data-cat="">
      <span class="ico">📚</span><span class="nm">${L('all')}</span><span class="cnt">${total}</span></button>`;
  for(const c of CATS){
    html += `<button class="nav-item${state.cat===c.name?' active':''}" data-cat="${esc(c.name)}">
      <span class="ico">${c.icon}</span><span class="nm">${esc(catName(c))}</span><span class="cnt">${c.items.length}</span></button>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{
    state.cat = b.dataset.cat || null;
    renderNav(); renderGrid();
    $('content').scrollTo({top:0});
  }));
  $('brandSub').textContent = L('brandSub', total);
  $('footInfo').textContent = L('foot', CATS.length, total);
}

/* ---------- grid ---------- */
function currentItems(){
  let list = state.cat ? CATS.find(c=>c.name===state.cat).items.slice() : THEMES.slice();
  const q = state.q.trim().toLowerCase();
  if(q){
    list = list.filter(t=>(t['名称']+' '+(t['发布商']||'')+' '+descOf(t)).toLowerCase().includes(q));
  }
  const s = state.sort;
  list.sort((a,b)=>{
    if(s==='rating')  return (Number(b['评分'])||0)-(Number(a['评分'])||0);
    if(s==='ratings') return (parseInt(b['评分数'])||0)-(parseInt(a['评分数'])||0);
    if(s==='date')    return String(b['发布日期']||'').localeCompare(String(a['发布日期']||''));
    return String(a['名称']||'').localeCompare(String(b['名称']||''),'en');
  });
  return list;
}

function renderGrid(){
  if(state.cat==='__bing__'){ renderBing(); return; }
  const list = currentItems();
  const q = state.q.trim();
  const cur = state.cat ? CATS.find(c=>c.name===state.cat) : null;
  $('catTitle').innerHTML = cur
    ? `${cur.icon} ${esc(catName(cur))}`
    : `📚 ${L('catTitle')}`;
  $('catSub').textContent = q
    ? L('found', q, list.length)
    : L('count', list.length);

  const grid = $('grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty"><div class="e-ico">🔍</div><p>${L('empty')}</p></div>`;
    return;
  }
  const catOf = new Map();
  CATS.forEach(c=>c.items.forEach(t=>{ if(!catOf.has(t['序号'])) catOf.set(t['序号'], c); }));

  grid.innerHTML = list.map((t,i)=>{
    const pv = previews(t);
    const cover = pv[0]||'';
    const c = catOf.get(t['序号']);
    const rate = Number(t['评分'])||0;
    const paid = isPaid(t);
    return `<article class="card" data-id="${t['序号']}" style="animation-delay:${Math.min(i*28,420)}ms">
      <div class="thumb">
        <img src="${esc(cover)}" alt="${esc(t['名称'])}" loading="lazy" decoding="async"
             onerror="this.style.opacity=0">
        ${c&&state.cat===null?`<span class="cat-chip">${c.icon} ${esc(catName(c))}</span>`:''}
        ${paid?`<span class="badge">${esc(t['价格'])}</span>`:`<span class="badge">${L('free')}</span>`}
      </div>
      <div class="body">
        <div class="name">${esc(t['名称'])}</div>
        <div class="pub">${esc(t['发布商']||L('unknownPub'))}</div>
        <div class="meta">
          <span class="stars"><span class="s">${starStr(rate)}</span> ${rate.toFixed(1)}</span>
          <span class="price${paid?' paid':''}">${L('wallpapers', pv.length)}</span>
        </div>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(el=>
    el.addEventListener('click',()=>openDetail(Number(el.dataset.id))));
}

let bingCache = null, bingIdx = 0, bingMonth = null;
async function pywebviewApi(){
  if(window.pywebview && window.pywebview.api) return window.pywebview.api;
  await new Promise(res=>{
    window.addEventListener('pywebviewready', res, {once:true});
    setTimeout(res, 2500);
  });
  return (window.pywebview||{}).api || null;
}

const ymOf = d => (d && d.length >= 6) ? `${d.slice(0,4)}-${d.slice(4,6)}` : '';
const curYM = ()=>{ const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; };
const shiftYM = (ym, delta)=>{
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
};
const ymLabel = ym=>{ const [y,m] = ym.split('-').map(Number); return L('ymFmt', y, m); };
const dateText = d => d && d.length===8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : '';

/** 弹出原生文件夹选择框；用户取消时返回 null */
async function chooseFolder(api){
  const r = await api.pick_folder();
  return (r && r.ok) ? r.path : null;
}

async function renderBing(){
  $('catTitle').innerHTML = `📅 ${L('bingCat')}`;
  $('catSub').textContent = L('bingSub');
  const grid = $('grid');
  const api = await pywebviewApi();
  if(!api){
    // 纯网页环境：引导用户跳转 Microsoft Store 安装桌面应用
    grid.innerHTML = `<div class="empty">
        <div class="e-ico">🖥️</div>
        <p>${L('bingHint')}</p>
        <a class="ms-badge" href="ms-windows-store://pdp/?ProductId=9PJJC37WP4NJ" title="${esc(L('bingGetApp'))}">
          <img src="https://get.microsoft.com/images/en-us%20dark.svg" alt="${esc(L('bingGetApp'))}">
        </a>
      </div>`;
    return;
  }
  if(!bingCache){
    grid.innerHTML = `<div class="empty"><div class="e-ico">⏳</div><p>${L('loading')}</p></div>`;
    bingCache = await api.get_bing();
  }
  if(!bingCache.ok || !bingCache.images || !bingCache.images.length){
    grid.innerHTML = `<div class="empty"><div class="e-ico">⚠️</div><p>${L('bingErr')}: ${esc(bingCache.error||'')}</p></div>`;
    return;
  }
  if(!bingMonth) bingMonth = curYM();

  const all = bingCache.images;
  const imgs = all.filter(im=>ymOf(im.date) === bingMonth);
  if(bingIdx >= imgs.length) bingIdx = 0;

  const bar = `<div class="bing-bar">
      <button class="btn nav-arrow" id="bmPrev" title="${esc(L('prevM'))}">❮</button>
      <input class="month" type="month" id="bmInput" value="${bingMonth}">
      <button class="btn nav-arrow" id="bmNext" title="${esc(L('nextM'))}">❯</button>
      <button class="btn" id="bmNow">${L('thisMonth')}</button>
      <span class="bing-note">${L('bingArchiveLimit')}</span>
    </div>`;

  if(!imgs.length){
    grid.innerHTML = bar +
      `<div class="empty"><div class="e-ico">📅</div><p>${L('bingArchiveLimit')}</p></div>`;
    bindBingBar();
    return;
  }

  const cur = imgs[bingIdx];
  grid.innerHTML = bar + `
    <div class="bing-hero">
      <img id="bingHero" src="${esc(cur.url)}" alt="">
      <div class="bing-meta">
        <h3 id="bingTitle">${esc(cur.title||L('today'))}</h3>
        <p id="bingCopy">${esc(cur.copyright||'')}</p>
        <p class="bing-date" id="bingDate">${esc(dateText(cur.date))}</p>
      </div>
      <div class="bing-actions">
        <button class="btn" id="bingDl">⬇ ${L('download')}</button>
        <button class="btn primary" id="bingSet">${L('setWall')}</button>
      </div>
    </div>
    <div class="bing-sec-label">${L('bingPrev')} · ${esc(ymLabel(bingMonth))}</div>
    <div class="bing-strip" id="bingStrip">
      ${imgs.map((im,i)=>`<img src="${esc(im.url)}" data-i="${i}" class="${i===bingIdx?'active':''}" alt="" loading="lazy">`).join('')}
    </div>`;
  bindBingBar();

  const select = i=>{
    bingIdx = i;
    const im = imgs[i];
    $('bingHero').src = im.url;
    $('bingTitle').textContent = im.title || L('today');
    $('bingCopy').textContent = im.copyright || '';
    $('bingDate').textContent = dateText(im.date);
    $('bingStrip').querySelectorAll('img').forEach(x=>x.classList.toggle('active', +x.dataset.i===i));
  };
  $('bingStrip').querySelectorAll('img').forEach(x=>x.addEventListener('click',()=>select(+x.dataset.i)));
  $('bingHero').addEventListener('click',()=>showViewer(imgs[bingIdx].url));
  $('bingDl').onclick = async ()=>{
    const folder = await chooseFolder(api);
    if(!folder) return;
    toast(L('dlStarted'));
    const r = await api.download_image(imgs[bingIdx].url, '', folder);
    r.ok ? toast(L('dlDone')+' '+r.path) : toast(L('dlFail')+': '+(r.error||''));
  };
  $('bingSet').onclick = async ()=>{
    const r = await api.set_wallpaper(imgs[bingIdx].url, 'Bing');
    r.ok ? toast(L('wpDone')) : toast(L('wpFail')+': '+(r.error||''));
  };
}

function bindBingBar(){
  $('bmInput').addEventListener('change',e=>{
    if(!e.target.value) return;
    bingMonth = e.target.value; bingIdx = 0; renderBing();
  });
  $('bmPrev').addEventListener('click',()=>{ bingMonth = shiftYM(bingMonth,-1); bingIdx=0; renderBing(); });
  $('bmNext').addEventListener('click',()=>{ bingMonth = shiftYM(bingMonth, 1); bingIdx=0; renderBing(); });
  $('bmNow').addEventListener('click',()=>{ bingMonth = curYM(); bingIdx=0; renderBing(); });
}

/* ---------- detail ---------- */
function openDetail(id){
  const t = byId.get(id); if(!t) return;
  curDetailId = id;
  const pv = previews(t);
  const rate = Number(t['评分'])||0;
  const c = CATS.find(c=>c.items.some(x=>x['序号']===id));
  $('dIcon').src = t['图标'] || pv[0] || '';
  $('dName').textContent = t['名称'];
  $('dPub').textContent = `${t['发布商']||L('unknownPub')} · ${L('productId', t['产品ID'])}`;
  $('dTags').innerHTML =
    (c?`<span>${c.icon} ${esc(catName(c))}</span>`:'')+
    `<span class="s" style="color:#e8a508">★ ${rate.toFixed(1)}</span>`+
    `<span>${L('ratings', esc(t['评分数']||0))}</span>`+
    `<span>${esc(priceText(t))}</span>`+
    `<span>${L('released', esc(t['发布日期']))}</span>`;
  $('dBody').innerHTML =
    (pv.length?`<div class="carousel">
       <div class="car-track" id="dTrack">${pv.map(u=>`<div class="car-slide"><img src="${esc(u)}" alt=""></div>`).join('')}</div>
       <button class="car-btn l" id="carPrev">❮</button>
       <button class="car-btn r" id="carNext">❯</button>
       <span class="car-ind" id="carInd">1 / ${pv.length}</span>
     </div>`:'')+
    (pv.length>1?`<div class="d-sub" id="dThumbs">${pv.map((u,i)=>`<img src="${esc(u)}" data-i="${i}" class="${i===0?'active':''}" alt="">`).join('')}</div>`:'')+
    `<p class="d-desc">${esc(descOf(t)||L('noDesc'))}</p>`+
    `<div class="d-info">
       <div class="cell"><b>${L('wallCount')}</b><span>${L('countUnit', pv.length)}</span></div>
       <div class="cell"><b>${L('rating')}</b><span>${rate.toFixed(1)} / 5.0</span></div>
       <div class="cell"><b>${L('ratingsLbl')}</b><span>${esc(t['评分数']||0)}</span></div>
       <div class="cell"><b>${L('price')}</b><span>${esc(priceText(t))}</span></div>
       <div class="cell"><b>${L('pubDate')}</b><span>${esc(t['发布日期']||'—')}</span></div>
       <div class="cell"><b>${L('productId','').replace(/[:：]\s*$/,'')}</b><span>${esc(t['产品ID']||'—')}</span></div>
     </div>`;
  const store = $('dStore');
  store.href = t['详情页'] || (`ms-windows-store://pdp/?ProductId=${t['产品ID']||''}`);
  store.textContent = L('store');
  $('dCopy').textContent = L('copyId');
  $('dClose').title = L('close');
  $('dCopy').onclick = ()=>{ navigator.clipboard?.writeText(t['产品ID']||'').then(()=>toast(L('copied', t['产品ID'])),()=>toast(L('copyFail'))); };
  $('scrim').classList.add('open');
  $('dBody').scrollTop = 0;

  // ---- 轮播：大图左右滚动，缩略图点击定位 ----
  let carIdx = 0;
  const track = $('dTrack');
  const updateCarUI = ()=>{
    $('carInd').textContent = `${carIdx+1} / ${pv.length}`;
    $('dThumbs')?.querySelectorAll('img').forEach(im=>
      im.classList.toggle('active', +im.dataset.i===carIdx));
  };
  const goCar = i=>{
    carIdx = (i + pv.length) % pv.length;
    track.scrollTo({left: carIdx * track.clientWidth, behavior:'smooth'});
    updateCarUI();
  };
  if(track){
    track.addEventListener('scroll',()=>{
      const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      if(i!==carIdx && i>=0 && i<pv.length){ carIdx=i; updateCarUI(); }
    },{passive:true});
    $('carPrev').addEventListener('click',()=>goCar(carIdx-1));
    $('carNext').addEventListener('click',()=>goCar(carIdx+1));
    track.querySelectorAll('.car-slide img').forEach(im=>im.addEventListener('click',()=>showViewer(im.src)));
  }
  $('dThumbs')?.querySelectorAll('img').forEach(im=>
    im.addEventListener('click',()=>goCar(+im.dataset.i)));

  // ---- 下载全部 / 设置当前图为桌面背景 ----
  $('dDlAll').textContent = L('downloadAll');
  $('dSetWall').textContent = L('setCurrent');
  $('dDlAll').onclick = async ()=>{
    if(!pv.length) return;
    const api = await pywebviewApi();
    if(!api){ toast(L('bingHint')); return; }
    const folder = await chooseFolder(api);
    if(!folder) return;
    toast(L('dlStarted'));
    const r = await api.download_all(pv, t['名称'], folder);
    r.ok ? toast(`${L('dlDone')} (${(r.saved||[]).length})`) : toast(L('dlFail')+': '+((r.errors||[])[0]||''));
  };
  $('dSetWall').onclick = async ()=>{
    if(!pv.length) return;
    const api = await pywebviewApi();
    if(!api){ toast(L('bingHint')); return; }
    const r = await api.set_wallpaper(pv[carIdx], t['名称']);
    r.ok ? toast(L('wpDone')) : toast(L('wpFail')+': '+(r.error||''));
  };
}
function closeDetail(){$('scrim').classList.remove('open');}
function showViewer(src){$('viewerImg').src=src;$('viewer').classList.add('open');}

/* ---------- events ---------- */
$('dClose').addEventListener('click',closeDetail);
$('scrim').addEventListener('click',e=>{ if(e.target===$('scrim')) closeDetail(); });
$('viewer').addEventListener('click',()=>$('viewer').classList.remove('open'));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDetail();$('viewer').classList.remove('open');$('langMenu').classList.remove('open');}
  if(e.key==='/'&&document.activeElement!==$('searchInput')){e.preventDefault();$('searchInput').focus();}
});

const si = $('searchInput'), sbox = $('searchBox');
si.addEventListener('input',()=>{
  state.q = si.value;
  sbox.classList.toggle('has-text', !!si.value);
  renderGrid();
});
$('searchClear').addEventListener('click',()=>{si.value='';state.q='';sbox.classList.remove('has-text');renderGrid();si.focus();});
$('sortSel').addEventListener('change',e=>{state.sort=e.target.value;renderGrid();});

$('themeBtn').addEventListener('click',()=>{
  const h = document.documentElement;
  const dark = h.dataset.theme==='dark';
  h.dataset.theme = dark?'light':'dark';
  $('themeBtn').textContent = dark?'🌙':'☀️';
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = state.lang==='zh' ? 'zh-CN' : 'en';
  document.title = L('docTitle');
  $('brandTitle').textContent = L('brand');
  $('navLabel').textContent = L('navLabel');
  $('searchInput').placeholder = L('searchPh');
  $('themeBtn').title = L('themeBtn');
  $('langBtn').title = L('langBtn');
  Array.from($('sortSel').options).forEach((o,i)=>o.textContent = L('sort')[i]);
  $('langMenu').querySelectorAll('button').forEach(b=>
    b.classList.toggle('active', b.dataset.lang===state.lang));
  renderNav(); renderGrid();
  if($('scrim').classList.contains('open') && curDetailId!=null) openDetail(curDetailId);
}
$('langBtn').addEventListener('click',e=>{
  e.stopPropagation();
  $('langMenu').classList.toggle('open');
});
$('langMenu').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  $('langMenu').classList.remove('open');
  if(state.lang===b.dataset.lang) return;
  state.lang = b.dataset.lang;
  applyLang();
}));
document.addEventListener('click',e=>{
  if(!e.target.closest('.lang-wrap')) $('langMenu').classList.remove('open');
});

/* ---------- init ---------- */
applyLang();
</script>
</body>
</html>
